name: CI

on:
  push:
    branches: ['**']
    # Documentation-only pushes skip CI (VALIDATION.md: prose changes need link/fact checks, not package runs).
    paths-ignore: ['docs/**', '**/*.md']
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']

permissions:
  contents: read

# A newer push to the same branch supersedes a run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            survey/package-lock.json
            module-swap/app/package-lock.json
      - run: npm ci
      # Root Meter pipeline tests exercise the real survey HTTP/WebSocket server.
      - run: npm ci --prefix survey
      - run: npm test
      - run: npm run build
      - name: survey
        working-directory: survey
        run: npm test && npm run build
      - name: module-swap
        working-directory: module-swap
        run: npm ci --prefix app && npm test && npm run build
      - name: Check diff whitespace
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then
            if git show-ref --verify --quiet refs/remotes/origin/main; then
              BASE=$(git merge-base HEAD origin/main)
            else
              BASE=$(git hash-object -t tree /dev/null)
            fi
          fi
          git diff --check "$BASE" HEAD
